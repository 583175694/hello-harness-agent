name: Android internal

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: Android versionCode (positive integer, must increase)
        required: true
      versionName:
        description: User-visible version, for example 0.1.1
        required: true

jobs:
  build-internal-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode internal keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_INTERNAL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing repository secret ANDROID_INTERNAL_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/internal-release.jks"

      - name: Build signed internal APK
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/internal-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_INTERNAL_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_INTERNAL_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_INTERNAL_KEY_PASSWORD }}
          HARNESS_VERSION_CODE: ${{ inputs.versionCode }}
          HARNESS_VERSION_NAME: ${{ inputs.versionName }}
        run: bash scripts/release-internal.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pipishrimp-android-${{ inputs.versionName }}-${{ inputs.versionCode }}
          path: artifacts/android-internal/
          if-no-files-found: error
