# §14.7 工程门禁：shared packages + web + api + mobile（不含 Maestro E2E / 真机 §14.1–6）
name: CI

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: pnpm check
        run: pnpm check

  native-mobile-gate-a-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate mobile-contract + Gate A invariants
        run: pnpm --filter @harness/mobile-contract validate:gate-a

      - name: Sync mobile-contract into Android assets
        run: bash apps/android/scripts/sync-mobile-contract.sh

      - name: Compile Preview (Paparazzi baselines 本地 optional，不进库)
        working-directory: apps/android
        run: ./gradlew :app:compilePreviewDebugKotlin --no-daemon

  native-mobile-gate-a-ios:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate mobile-contract + Gate A invariants
        run: pnpm --filter @harness/mobile-contract validate:gate-a

      - name: Keyed snapshot PNG baselines (Gate A, iOS only)
        run: pnpm gate-a:list-snapshot-baselines

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Resolve Swift package dependencies
        working-directory: apps/ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme Harness \
            CODE_SIGNING_ALLOWED=NO

      - name: Snapshot tests (skip Markdown golden L2)
        working-directory: apps/ios
        run: |
          xcodebuild test \
            -scheme Harness \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:HarnessTests \
            -skip-testing:HarnessTests/GateAMarkdownGoldenSnapshotTests \
            CODE_SIGNING_ALLOWED=NO

  native-mobile-gate-a-harmony:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate mobile-contract + Gate A invariants
        run: pnpm --filter @harness/mobile-contract validate:gate-a

      - name: Sync mobile-contract into Harmony rawfile
        run: bash apps/harmony/scripts/sync-mobile-contract.sh

      - name: Assert preview fixtures (Gate A)
        run: node apps/harmony/scripts/assert-preview-fixtures.mjs

  native-mobile-phase-b-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: mobile-core JVM golden + ohos placeholder
        run: pnpm mobile-core:test && pnpm mobile-core:verify:ohos

      - name: Gate A invariants (Phase B 不回归 Preview)
        run: pnpm validate:gate-a

      - name: Android production Core compile (Phase B B0)
        working-directory: apps/android
        run: ./gradlew :app:compileProductionDebugKotlin --no-daemon

  native-mobile-phase-b-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build HarnessMobileCore XCFramework
        run: pnpm mobile-core:xcframework

      - name: Release Core compile (Harness + KMP)
        working-directory: apps/ios
        run: |
          xcodegen generate
          xcodebuild \
            -scheme Harness \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            build \
            CODE_SIGNING_ALLOWED=NO

  maestro-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Maestro CLI
        run: |
          bash apps/mobile/scripts/install-maestro.sh
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Maestro flow syntax (§12.2 YAML, six flows, no simulator)
        run: pnpm --filter @harness/mobile test:maestro:syntax
