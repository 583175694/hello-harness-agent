# §14.7 工程门禁：shared packages + web + api + mobile（不含 Maestro E2E / 真机 §14.1–6）
name: CI

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: pnpm check
        run: pnpm check

  native-mobile-gate-a-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate mobile-contract + Gate A invariants
        run: pnpm --filter @harness/mobile-contract validate:gate-a

      - name: Keyed snapshot PNG baselines (Gate A)
        run: pnpm gate-a:list-snapshot-baselines

      - name: Sync mobile-contract into Android assets
        run: bash apps/android/scripts/sync-mobile-contract.sh

      - name: Paparazzi verify (Preview)
        working-directory: apps/android
        run: ./gradlew :app:verifyPaparazziPreviewDebug --no-daemon

  native-mobile-gate-a-ios:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate mobile-contract + Gate A invariants
        run: pnpm --filter @harness/mobile-contract validate:gate-a

      - name: Keyed snapshot PNG baselines (Gate A)
        run: pnpm gate-a:list-snapshot-baselines

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Snapshot tests
        working-directory: apps/ios
        run: |
          xcodebuild test \
            -scheme Harness \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:HarnessTests \
            CODE_SIGNING_ALLOWED=NO

  native-mobile-gate-a-harmony:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate mobile-contract + Gate A invariants
        run: pnpm --filter @harness/mobile-contract validate:gate-a

      - name: Sync mobile-contract into Harmony rawfile
        run: bash apps/harmony/scripts/sync-mobile-contract.sh

      - name: Assert preview fixtures (Gate A)
        run: node apps/harmony/scripts/assert-preview-fixtures.mjs

  maestro-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Maestro CLI
        run: |
          bash apps/mobile/scripts/install-maestro.sh
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Maestro flow syntax (§12.2 YAML, six flows, no simulator)
        run: pnpm --filter @harness/mobile test:maestro:syntax
