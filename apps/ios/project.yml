name: Harness
packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.17.6
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0
options:
  bundleIdPrefix: com.harness
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
targets:
  Harness:
    type: application
    platform: iOS
    sources:
      - path: Harness
      - path: CoreUI
      - path: Harness/Resources/brand-icon-app.png
        buildPhase: resources
      - path: Harness/Resources/login-hero-illustration.png
        buildPhase: resources
      - path: ../../packages/mobile-contract/fixtures/preview
        name: preview
        type: folder
        buildPhase: resources
      - path: ../../packages/mobile-contract/design-tokens.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harness.agent
        INFOPLIST_KEY_CFBundleDisplayName: Harness
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: PREVIEW_PORT
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: CORE_PORT
          # XCFramework 仅含 ios-arm64(-simulator) slice；避免链接 x86_64 模拟器目标。
          EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
          FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]: $(inherited) $(SRCROOT)/../../packages/mobile-core/core-engine/build/XCFrameworks/release/core_engine.xcframework/ios-arm64-simulator
          FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]: $(inherited) $(SRCROOT)/../../packages/mobile-core/core-engine/build/XCFrameworks/release/core_engine.xcframework/ios-arm64
          OTHER_LDFLAGS[sdk=iphonesimulator*]: $(inherited) -F$(SRCROOT)/../../packages/mobile-core/core-engine/build/XCFrameworks/release/core_engine.xcframework/ios-arm64-simulator -framework HarnessMobileCore
          OTHER_LDFLAGS[sdk=iphoneos*]: $(inherited) -F$(SRCROOT)/../../packages/mobile-core/core-engine/build/XCFrameworks/release/core_engine.xcframework/ios-arm64 -framework HarnessMobileCore
          OTHER_SWIFT_FLAGS[sdk=iphonesimulator*]: $(inherited) -F$(SRCROOT)/../../packages/mobile-core/core-engine/build/XCFrameworks/release/core_engine.xcframework/ios-arm64-simulator
          OTHER_SWIFT_FLAGS[sdk=iphoneos*]: $(inherited) -F$(SRCROOT)/../../packages/mobile-core/core-engine/build/XCFrameworks/release/core_engine.xcframework/ios-arm64
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
    info:
      path: Harness/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
  HarnessTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HarnessTests
    dependencies:
      - target: Harness
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.harness.agent.tests
schemes:
  Harness:
    build:
      targets:
        Harness: all
    test:
      gatherCoverageData: false
      targets:
        - HarnessTests
