<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f6" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Harness Workbench</title>
    <script>
      (function () {
        var key = 'harness-theme';
        var stored = localStorage.getItem(key);
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            typeof matchMedia !== 'undefined' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.dataset.theme = dark ? 'dark' : 'light';
        root.style.colorScheme = dark ? 'dark' : 'light';
        var fontKey = 'harness-content-font-size';
        var fontStored = localStorage.getItem(fontKey);
        var fontSize = fontStored ? parseInt(fontStored, 10) : 14;
        if (!Number.isFinite(fontSize) || fontSize < 12) fontSize = 14;
        if (fontSize > 17) fontSize = 17;
        root.style.setProperty('--h-content-font-size', fontSize + 'px');
        document.querySelector('meta[name="theme-color"]').content = dark ? '#141414' : '#f7f7f6';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
