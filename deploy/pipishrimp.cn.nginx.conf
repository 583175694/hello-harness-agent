# pipishrimp.cn：Hello Harness Agent（443）+ 保留 /recruitment 招聘站
# 安装：sudo cp deploy/pipishrimp.cn.nginx.conf /etc/nginx/sites-available/chat-app.conf
#       sudo ln -sf /etc/nginx/sites-available/chat-app.conf /etc/nginx/sites-enabled/chat-app.conf
#       sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.pipishrimp.cn;

    ssl_certificate /etc/letsencrypt/live/pipishrimp.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pipishrimp.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://pipishrimp.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pipishrimp.cn;

    ssl_certificate /etc/letsencrypt/live/pipishrimp.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pipishrimp.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    root /www/hello-harness-agent/apps/web/dist;
    index index.html;

    # 招聘系统（独立前端，保持不变）
    location /recruitment/ {
        alias /www/recruitment-system/frontend/dist/;
        index index.html;
    }

    location /recruitment-api/ {
        proxy_pass http://127.0.0.1:3031/recruitment-api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4318;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:4318/healthz;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:4318/readyz;
    }

    location = / {
        return 302 /agent;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name pipishrimp.cn www.pipishrimp.cn;
    return 301 https://$host$request_uri;
}
